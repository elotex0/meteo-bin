name: ECMWF IFS Pipeline

on:
  workflow_dispatch:

# Verhindert, dass zwei Läufe gleichzeitig auf R2 schreiben und sich gegenseitig stören
concurrency:
  group: ecmwf-ifs-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  ARTIFACT_DAYS: 1      # Zwischenergebnisse werden nur kurz gebraucht

jobs:
  # ---------------------------------------------------------------------------
  # 1) RUN und DATE einmalig bestimmen, damit alle Jobs denselben Modelllauf nutzen
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.set_run_date.outputs.run }}
      date: ${{ steps.set_run_date.outputs.date }}
    steps:
      - name: Set RUN and DATE
        id: set_run_date
        run: |
          HOUR=$(date -u +%H)
          case $HOUR in
            07|08|09|11|12|13) RUN=00 ;;
            19|20|21|22) RUN=12 ;;
          esac
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)
          DAY=$(date -u +%d)
          DATE=$(date -u +%Y%m%d)
          # set env variables
          echo "RUN=$RUN" >> $GITHUB_ENV
          echo "YEAR=$YEAR" >> $GITHUB_ENV
          echo "MONTH=$MONTH" >> $GITHUB_ENV
          echo "DAY=$DAY" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          # set step output for job output
          echo "run=$RUN" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # 2) Pro Variable: OM-Datei direkt von Open-Meteo laden und PNGs erzeugen
  # ---------------------------------------------------------------------------
  generate_pngs:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 60
    env:
      RUN: ${{ needs.prepare.outputs.run }}
      DATE: ${{ needs.prepare.outputs.date }}
      # Matrix-Werte als Umgebungsvariablen, damit die Shell-Skripte lesbar bleiben
      VARIABLE: ${{ matrix.variable }}
      OM_FILE: ${{ matrix.om_file }}
    strategy:
      fail-fast: false      # eine fehlgeschlagene Variable stoppt die anderen nicht
      matrix:
        include:
          # variable: Ausgabe-/Eingabeordner, om_file: Dateiname bei Open-Meteo
          - variable: t2m
            om_file: temperature_2m
          - variable: wind
            om_file: wind_gusts_10m

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip            # ersetzt den manuellen actions/cache-Schritt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download OM file from Open-Meteo S3
        run: |
          mkdir -p "data/$VARIABLE"
          BASE_URL="https://openmeteo.s3.amazonaws.com/data_run/ecmwf_ifs025/${DATE:0:4}/${DATE:4:2}/${DATE:6:2}/${RUN}00Z"
          echo "Lade von: $BASE_URL/$OM_FILE.om"
          curl -fSL --retry 3 --max-time 600 \
            "$BASE_URL/$OM_FILE.om" -o "data/$VARIABLE/$OM_FILE.om"

      - name: Generate PNGs
        run: |
          mkdir -p "ifs/$VARIABLE"
          python models/ifs/bin_ifs.py "data/$VARIABLE" "ifs/$VARIABLE" "$VARIABLE"

      # Ganzes ifs/-Verzeichnis hochladen, damit der Variablenordner im Artifact erhalten bleibt
      - name: Upload PNGs artifact
        uses: actions/upload-artifact@v7
        with:
          name: ifs-${{ matrix.variable }}
          path: ifs/
          retention-days: ${{ env.ARTIFACT_DAYS }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) Ergebnisse zusammenführen, Metadaten erzeugen, komprimieren, nach R2 hochladen
  # ---------------------------------------------------------------------------
  deploy_to_r2:
    runs-on: ubuntu-latest
    needs: [prepare, generate_pngs]
    timeout-minutes: 30
    env:
      RUN: ${{ needs.prepare.outputs.run }}
      DATE: ${{ needs.prepare.outputs.date }}
      BUCKET: ${{ secrets.ECMWF_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.GLOBAL_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GLOBAL_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto    # von R2 erwartet, vermeidet Region-Warnungen
      R2_ENDPOINT: https://${{ secrets.GLOBAL_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Alle Variablen-Artifacts landen direkt in einem Ordner (Struktur: ifs/<RUN>/<variable>/...)
      - name: Download all PNG artifacts (merged)
        uses: actions/download-artifact@v8
        with:
          pattern: ifs-*
          merge-multiple: true
          path: ifs/${{ needs.prepare.outputs.run }}

      - name: Generate Metadata
        run: python models/ifs/meta_ifs.py "ifs/$RUN" "$RUN" "$DATE"

      # Parallel gzip-komprimieren (Dateiname bleibt gleich, Inhalt ist gzip)
      - name: Dateien mit gzip komprimieren
        run: |
          find "ifs/$RUN" -type f -print0 \
            | xargs -0 -P "$(nproc)" -I{} sh -c 'gzip -9 -n -c "{}" > "{}.tmp" && mv "{}.tmp" "{}"'

      # Alle alten Run-Ordner löschen, den aktuellen behalten
      - name: Clean old runs on R2 except current
        run: |
          for run_folder in $(aws s3 ls "s3://$BUCKET/ifs/" --endpoint-url "$R2_ENDPOINT" | awk '/PRE/ {print $2}' | sed 's#/##'); do
            if [ "$run_folder" != "$RUN" ]; then
              aws s3 rm "s3://$BUCKET/ifs/$run_folder/" --recursive --endpoint-url "$R2_ENDPOINT"
            fi
          done

      # Erst die Daten, zuletzt die metadata.json, damit Clients nie auf noch fehlende Dateien verweisen
      - name: Upload current run and metadata.json to R2
        run: |
          aws s3 sync "./ifs/$RUN/" "s3://$BUCKET/ifs/$RUN/" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/gzip

          aws s3 cp ./ifs/metadata.json "s3://$BUCKET/ifs/metadata.json" \
            --endpoint-url "$R2_ENDPOINT"