name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup_old_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const targetWorkflows = [
              "ICON-D2 Pipeline",
            ];

            const keepLatest = 1;
            const olderThanDays = 0;
            const cutoff = Date.now() - olderThanDays * 24 * 60 * 60 * 1000;

            const { owner, repo } = context.repo;

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 }
            );

            const selected = workflows.filter(w =>
              targetWorkflows.length === 0 ||
              targetWorkflows.includes(w.name) ||
              targetWorkflows.includes(w.path.split('/').pop())
            );

            for (const wf of selected) {
              console.log(`\n=== Workflow: ${wf.name} ===`);

              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner, repo,
                  workflow_id: wf.id,
                  status: 'completed',
                  per_page: 100
                }
              );

              runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const toDelete = runs.slice(keepLatest)
                .filter(r => olderThanDays === 0 || new Date(r.created_at).getTime() < cutoff);

              console.log(`${runs.length} Runs gefunden, ${toDelete.length} werden gelöscht`);

              for (const run of toDelete) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner, repo, run_id: run.id
                  });
                  console.log(`Gelöscht: Run ${run.id} (${run.created_at})`);
                } catch (err) {
                  console.log(`Fehler bei Run ${run.id}: ${err.message}`);
                }
              }
            }