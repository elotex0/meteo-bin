name: ICON-RUC Pipeline

on:
  workflow_dispatch:

# Verhindert, dass zwei Läufe gleichzeitig auf R2 schreiben
concurrency:
  group: icon-ruc-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/tools/encoding
  MAX_HOUR: 27          # letzte Vorhersagestunde (0..MAX_HOUR)
  DL_PARALLEL: 16       # gleichzeitige Downloads pro Job
  ARTIFACT_DAYS: 1      # Zwischenergebnisse werden nur kurz gebraucht

jobs:
  # ---------------------------------------------------------------------------
  # 1) RUN und DATE einmalig bestimmen, damit alle Jobs denselben Modelllauf nutzen
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.set_run_date.outputs.run }}
      date: ${{ steps.set_run_date.outputs.date }}
    steps:
      - name: Set RUN and DATE (hourly)
        id: set_run_date
        run: |
          RUN=$(date -u +%H)
          DATE=$(date -u +%Y-%m-%d)
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Current UTC hour -> RUN=$RUN, DATE=$DATE"

  # ---------------------------------------------------------------------------
  # 2) Pro Gruppe: Daten direkt vom DWD laden und BINs erzeugen
  # ---------------------------------------------------------------------------
  generate_bins:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 60
    env:
      RUN: ${{ needs.prepare.outputs.run }}
      DATE: ${{ needs.prepare.outputs.date }}
      DOWNLOADS: ${{ matrix.downloads }}
      LANES: ${{ matrix.lanes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # downloads: DWD_PARAMETER:zielordner:dateiprefix:startstunde
          #            (DWD_PARAMETER darf Pfadteile enthalten, z. B. SRH/lvt1/103/lv1/3000)
          #
          # lanes:     Leerzeichen trennt parallele Lanes,
          #            Komma trennt Variablen, die in einer Lane nacheinander laufen.
          #            Format je Variable: name=eingabeordner[+weitere_ordner]
          #            Beispiel: scp=srh3km+cape_ml+wshear_u+wshear_v
          #            -> bin_icon-ruc.py data/srh3km <out> scp <grid> data/cape_ml data/wshear_u data/wshear_v
          - name: basic
            downloads: "T_2M:t2m:t2m:0 WW:ww:ww:1 VMAX_10M:wind:wind:0"
            lanes: "t2m=t2m ww=ww wind=wind"

          - name: precip_radar
            downloads: "TOT_PREC_D:tp:tot_prec:0 TOT_PREC:tp_acc:tp_acc:0 DBZ_CMAX:dbz_cmax:dbz_cmax:0"
            lanes: "tp=tp tp_acc=tp_acc dbz_cmax=dbz_cmax"

          # cape_ml, srh3km, ehi und scp lesen teils dieselben Ordner -> eine Lane, nacheinander
          - name: severe
            downloads: "CAPE_ML:cape_ml:cape_ml:0 SRH/lvt1/103/lv1/3000:srh3km:srh3km:0 WSHEAR_U/lvt1/103/lv1/6000:wshear_u:wshear_u:0 WSHEAR_V/lvt1/103/lv1/6000:wshear_v:wshear_v:0"
            lanes: "cape_ml=cape_ml,srh3km=srh3km,ehi=srh3km+cape_ml,scp=srh3km+cape_ml+wshear_u+wshear_v"

          # Schnee (aktuell deaktiviert):
          # - name: snow
          #   downloads: "H_SNOW:snow:snow:0"
          #   lanes: "snow=snow"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download grid (clat/clon)
        run: |
          mkdir -p data/grid
          base=https://github.com/elotex0/meteo-bin/releases/download/icon-ruc
          wget -q "$base/clat.grib2" -O data/grid/clat.grib2 &
          wget -q "$base/clon.grib2" -O data/grid/clon.grib2 &
          wait

      # Alle Parameter x Stunden dieser Gruppe laufen in einem gemeinsamen Pool
      - name: Download GRIB2 files (nur benötigte Parameter)
        run: |
          export DATE RUN
          for spec in $DOWNLOADS; do
            IFS=: read -r PARAM DIR PREFIX START <<< "$spec"
            mkdir -p "data/$DIR"
            for h in $(seq "$START" "$MAX_HOUR"); do
              echo "$PARAM $DIR $PREFIX $h"
            done
          done | xargs -P "$DL_PARALLEL" -L1 bash -c '
            PARAM=$0; DIR=$1; PREFIX=$2
            i=$(printf "%03d" "$3")
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2-ruc/p/${PARAM}/r/${DATE}T${RUN}:00/s/PT${i}H00M.grib2"
            OUT="data/${DIR}/${PREFIX}_${i}.grib2"
            wget -q --tries=3 --timeout=30 -O "$OUT" "$URL" \
              || { echo "Datei $URL nicht verfügbar, überspringe..."; rm -f "$OUT"; }
          '

      # Abbruch, wenn für einen Parameter gar nichts geladen wurde (z. B. Lauf noch nicht veröffentlicht)
      - name: Check downloads
        run: |
          for spec in $DOWNLOADS; do
            IFS=: read -r PARAM DIR PREFIX START <<< "$spec"
            n=$(find "data/$DIR" -name '*.grib2' | wc -l)
            echo "$PARAM: $n Dateien"
            if [ "$n" -eq 0 ]; then
              echo "::error::Keine Dateien für $PARAM (Run $RUN, $DATE) gefunden"
              exit 1
            fi
          done

      # Jede Lane läuft parallel und bekommt eine eigene Grid-Kopie (keine Race Condition
      # bei cfgrib-Indexdateien). Innerhalb einer Lane laufen die Variablen nacheinander.
      - name: Generate BINs
        run: |
          printf '%s\n' $LANES | nl -w1 -s' ' \
            | xargs -P "$(nproc)" -L1 bash -c '
              set -e
              ID=$0; LANE=$1
              cp -r data/grid "data/grid_$ID"
              IFS=, read -ra ENTRIES <<< "$LANE"
              for entry in "${ENTRIES[@]}"; do
                VAR=${entry%%=*}
                IFS=+ read -ra DIRS <<< "${entry#*=}"
                args=()
                for d in "${DIRS[@]}"; do args+=("data/$d"); done
                mkdir -p "iconruc/$VAR"
                python models/icon-ruc/bin_icon-ruc.py "${args[0]}" "iconruc/$VAR" "$VAR" "data/grid_$ID" "${args[@]:1}"
              done
            '

      - name: Upload BINs artifact
        uses: actions/upload-artifact@v7
        with:
          name: iconruc-${{ matrix.name }}
          path: iconruc/
          retention-days: ${{ env.ARTIFACT_DAYS }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) Ergebnisse zusammenführen, Metadaten erzeugen, komprimieren, nach R2 hochladen
  # ---------------------------------------------------------------------------
  deploy_to_r2:
    runs-on: ubuntu-latest
    needs: [prepare, generate_bins]
    timeout-minutes: 30
    env:
      RUN: ${{ needs.prepare.outputs.run }}
      DATE: ${{ needs.prepare.outputs.date }}
      BUCKET: ${{ secrets.ICONRUC_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.ICON_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ICON_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.ICON_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Struktur danach: iconruc/<RUN>/<variable>/...
      - name: Download all BINs artifacts (merged)
        uses: actions/download-artifact@v8
        with:
          pattern: iconruc-*
          merge-multiple: true
          path: iconruc/${{ needs.prepare.outputs.run }}

      - name: Generate Metadata
        run: python models/icon-ruc/meta_icon-ruc.py "iconruc/$RUN" "$RUN" "$DATE"

      - name: Dateien mit gzip komprimieren
        run: |
          find "iconruc/$RUN" -type f -print0 \
            | xargs -0 -P "$(nproc)" -I{} sh -c 'gzip -9 -n -c "{}" > "{}.tmp" && mv "{}.tmp" "{}"'

      # Alle alten Run-Ordner löschen, den aktuellen behalten
      - name: Clean old runs on R2 except current
        run: |
          for run_folder in $(aws s3 ls "s3://$BUCKET/icon-ruc/" --endpoint-url "$R2_ENDPOINT" | awk '/PRE/ {print $2}' | sed 's#/##'); do
            if [ "$run_folder" != "$RUN" ]; then
              aws s3 rm "s3://$BUCKET/icon-ruc/$run_folder/" --recursive --endpoint-url "$R2_ENDPOINT"
            fi
          done

      # Erst die Daten, zuletzt die metadata.json
      - name: Upload current run and metadata.json to R2
        run: |
          aws s3 sync "./iconruc/$RUN/" "s3://$BUCKET/icon-ruc/$RUN/" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/gzip

          aws s3 cp ./iconruc/metadata.json "s3://$BUCKET/icon-ruc/metadata.json" \
            --endpoint-url "$R2_ENDPOINT"