name: ICON-D2 Pipeline

on:
  workflow_dispatch:

env:
     PYTHONPATH: ${{ github.workspace }}/tools

jobs:
  fetch_and_generate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.set_run_date.outputs.run }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BIN_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'


      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set RUN and DATE
        id: set_run_date
        run: |
          HOUR=$(date -u +%H)
          case $HOUR in
            00|01|02|03) RUN=00 ;;
            04|05|06) RUN=03 ;;
            07|08|09) RUN=06 ;;
            10|11|12) RUN=09 ;;
            13|14|15) RUN=12 ;;
            16|17|18) RUN=15 ;;
            19|20|21) RUN=18 ;;
            22|23) RUN=21 ;;
          esac
          DATE=$(date -u +%Y-%m-%d)
          # set env variables
          echo "RUN=$RUN" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          # set step output for job output
          echo "run=$RUN" >> $GITHUB_OUTPUT

      - name: Download ICON grid (clat/clon)
        run: |
          mkdir -p data/grid
          wget -q https://github.com/elotex0/meteo-bin/releases/download/icon-d2/clat.grib2 -O data/grid/clat.grib2
          wget -q https://github.com/elotex0/meteo-bin/releases/download/icon-d2/clon.grib2 -O data/grid/clon.grib2
          echo "✅ ICON grid (clat/clon) heruntergeladen"

      - name: Download t2m GRIB2 files
        run: |
          mkdir -p data/t2m
          cd data/t2m
          seq 0 48 | xargs -n 1 -P 12 -I{} bash -c '
            i_padded=$(printf "%03d" {})
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/T_2M/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2"
            wget -O t2m_${i_padded}.grib2 "$URL" || echo "Datei $URL nicht verfügbar, überspringe..."
          '
      
      - name: Download ww GRIB2 files
        run: |
          mkdir -p data/ww
          cd data/ww
          seq 1 48 | xargs -n 1 -P 12 -I{} bash -c '
            i_padded=$(printf "%03d" {})
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/WW/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2"
            wget -O ww_${i_padded}.grib2 "$URL" || echo "Datei $URL nicht verfügbar, überspringe..."
          '
      
      - name: Download tp GRIB2 files
        run: |
          mkdir -p data/tp
          cd data/tp
          seq 0 48 | xargs -n 1 -P 12 -I{} bash -c '
            i_padded=$(printf "%03d" {})
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/TOT_PREC/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2"
            wget -O tot_prec_${i_padded}.grib2 "$URL" || echo "Datei $URL nicht verfügbar, überspringe..."
          '

      - name: Download CAPE_ML GRIB2 files
        run: |
          mkdir -p data/cape_ml
          cd data/cape_ml
          seq 0 48 | xargs -n 1 -P 12 -I{} bash -c '
            i_padded=$(printf "%03d" {})
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/CAPE_ML/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2"
            wget -O cape_ml_${i_padded}.grib2 "$URL" || echo "Datei $URL nicht verfügbar, überspringe..."
          '

      - name: Download DBZ_CMAX GRIB2 files
        run: |
          mkdir -p data/dbz_cmax
          cd data/dbz_cmax
          seq 0 48 | xargs -n 1 -P 12 -I{} bash -c '
            i_padded=$(printf "%03d" {})
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/DBZ_CMAX/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2"
            wget -O dbz_cmax_${i_padded}.grib2 "$URL" || echo "Datei $URL nicht verfügbar, überspringe..."
          '
      - name: Download vmax_10m GRIB2 files
        run: |
          mkdir -p data/wind
          cd data/wind
          seq 0 48 | xargs -n 1 -P 12 -I{} bash -c '
            i_padded=$(printf "%03d" {} )
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/VMAX_10M/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2"
            wget -O wind_${i_padded}.grib2 "$URL" || echo "Datei $URL nicht verfügbar, überspringe..."
          '
          
      - name: Download sde GRIB2 files
        run: |
          mkdir -p data/snow
          cd data/snow
          seq 0 48 | xargs -n 1 -P 12 -I{} bash -c '
            i_padded=$(printf "%03d" {} )
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/H_SNOW/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2"
            wget -O snow_${i_padded}.grib2 "$URL" || echo "Datei $URL nicht verfügbar, überspringe..."
          '

          
      - name: Download clct GRIB2 files
        run: |
          mkdir -p data/cloud
          cd data/cloud
          seq 0 48 | xargs -n 1 -P 12 -I{} bash -c '
            i_padded=$(printf "%03d" {} )
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/CLCT/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2"
            wget -O cloud_${i_padded}.grib2 "$URL" || echo "Datei $URL nicht verfügbar, überspringe..."
          '
      - name: Download twater GRIB2 files
        run: |
          mkdir -p data/twater
          cd data/twater
          seq 0 48 | xargs -n 1 -P 12 -I{} bash -c '
            i_padded=$(printf "%03d" {} )
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/TWATER/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2"
            wget -O twater_${i_padded}.grib2 "$URL" || echo "Datei $URL nicht verfügbar, überspringe..."
          '

      - name: Download snowfall GRIB2 files
        run: |
          mkdir -p data/snowfall
          cd data/snowfall
          seq 0 48 | xargs -n 1 -P 12 -I{} bash -c '
            i_padded=$(printf "%03d" {} )
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/SNOWLMT/r/${DATE}T${RUN}:00/s/PT${i_padded}H00M.grib2"
            wget -O snowfall_${i_padded}.grib2 "$URL" || echo "Datei $URL nicht verfügbar, überspringe..."
          '
          
      - name: Upload GRIB2 as artifact
        uses: actions/upload-artifact@v7
        with:
          name: grib2
          path: data/
      
      - name: Upload Grid File as artifact
        uses: actions/upload-artifact@v7
        with:
          name: grid
          path: data/grid/

      - name: Delete GRIB2 and grid files (local cleanup)
        run: rm -rf data/


  generate_pngs:
    runs-on: ubuntu-latest
    needs: fetch_and_generate
    strategy:
      matrix:
        variable: [t2m, ww, tp, tp_acc, wind, cape_ml, dbz_cmax, cloud, twater, snowfall, change_snow, snow]
      max-parallel: 12
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download GRIB2 artifact
        uses: actions/download-artifact@v8
        with:
          name: grib2
          path: data/

      - name: Download grid artifact
        uses: actions/download-artifact@v8
        with:
          name: grid
          path: data/grid/

      - name: Generate PNGs for ${{ matrix.variable }}
        run: |
          mkdir -p icond2/${{ matrix.variable }}
          input_dir="data/${{ matrix.variable }}"
          if [ "${{ matrix.variable }}" = "tp_acc" ]; then
            input_dir="data/tp"
          elif [ "${{ matrix.variable }}" = "change_snow" ]; then
            input_dir="data/snow"
          fi
          python models/icon-d2/bin_icon-d2.py \
            "$input_dir" \
            icond2/${{ matrix.variable }} \
            ${{ matrix.variable }} \
            data/grid


      - name: Upload Bin artifact
        uses: actions/upload-artifact@v7
        with:
          name: icond2-${{ matrix.variable }}
          path: icond2/${{ matrix.variable }}

  deploy_to_r2:
    runs-on: ubuntu-latest
    needs: [fetch_and_generate, generate_pngs]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Download all Bin artifact
        uses: actions/download-artifact@v8
        with:
          pattern: icond2-*
          path: icond2_raw

      - name: Merge PNG folders into one structure
        run: |
          mkdir -p icond2/${{ needs.fetch_and_generate.outputs.run }}
          for d in icond2_raw/*; do
            if [ -d "$d" ]; then
              varname=$(basename "$d" | sed 's/^icond2-//')  # entfernt "icond2-" Prefix
              mkdir -p icond2/${{ needs.fetch_and_generate.outputs.run }}/"$varname"
              cp -r "$d"/* icond2/${{ needs.fetch_and_generate.outputs.run }}/"$varname"/ || true
            fi
          done

      - name: Generate Metadata
        run: |
          python models/icon-d2/meta_icon-d2.py icond2/${{ needs.fetch_and_generate.outputs.run }} ${{ needs.fetch_and_generate.outputs.run }} ${{ env.DATE }}

      - name: Rohdateien mit gzip komprimieren
        run: |
          find icond2/${{ needs.fetch_and_generate.outputs.run }} -type f | while read -r f; do
            gzip -9 -n -c "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Clean old runs on R2 except current
        run: |
          for run_folder in $(aws s3 ls s3://${{ secrets.ICOND2_BUCKET }}/icon-d2/ --endpoint-url https://${{ secrets.ICON_ACCOUNT_ID }}.r2.cloudflarestorage.com | awk '{print $2}' | sed 's#/##'); do
            if [ "$run_folder" != "${{ needs.fetch_and_generate.outputs.run }}/" ]; then
              aws s3 rm s3://${{ secrets.ICOND2_BUCKET }}/icon-d2/$run_folder --recursive --endpoint-url https://${{ secrets.ICON_ACCOUNT_ID }}.r2.cloudflarestorage.com
            fi
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ICON_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ICON_SECRET_ACCESS_KEY }}

      - name: Upload current run and metadata.json to R2
        run: |
          # Upload run folder
          aws s3 sync ./icond2/${{ needs.fetch_and_generate.outputs.run }}/ s3://${{ secrets.ICOND2_BUCKET }}/icon-d2/${{ needs.fetch_and_generate.outputs.run }}/ \
            --endpoint-url https://${{ secrets.ICON_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --content-type application/gzip \

          # Upload metadata.json outside run folder
          aws s3 cp ./icond2/metadata.json s3://${{ secrets.ICOND2_BUCKET }}/icon-d2/metadata.json \
            --endpoint-url https://${{ secrets.ICON_ACCOUNT_ID }}.r2.cloudflarestorage.com
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ICON_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ICON_SECRET_ACCESS_KEY }}