name: ICON-D2 Pipeline

on:
  workflow_dispatch:

# Verhindert, dass zwei Läufe gleichzeitig auf R2 schreiben und sich gegenseitig stören
concurrency:
  group: icon-d2-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/tools
  MAX_HOUR: 48          # letzte Vorhersagestunde (0..MAX_HOUR)
  DL_PARALLEL: 16       # gleichzeitige Downloads pro Job
  ARTIFACT_DAYS: 1      # Zwischenergebnisse werden nur kurz gebraucht

jobs:
  # ---------------------------------------------------------------------------
  # 1) RUN und DATE einmalig bestimmen, damit alle Jobs denselben Modelllauf nutzen
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.set_run_date.outputs.run }}
      date: ${{ steps.set_run_date.outputs.date }}
    steps:
      - name: Set RUN and DATE
        id: set_run_date
        run: |
          HOUR=$(date -u +%H)
          # ICON-D2 läuft alle 3 Stunden; wir nehmen den zuletzt gestarteten Lauf
          case $HOUR in
            00|01|02|03) RUN=00 ;;
            04|05|06)    RUN=03 ;;
            07|08|09)    RUN=06 ;;
            10|11|12)    RUN=09 ;;
            13|14|15)    RUN=12 ;;
            16|17|18)    RUN=15 ;;
            19|20|21)    RUN=18 ;;
            22|23)       RUN=21 ;;
          esac
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2) Pro Gruppe: Daten direkt von DWD laden und PNGs/Bins erzeugen
  # ---------------------------------------------------------------------------
  generate_pngs:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 60
    env:
      RUN: ${{ needs.prepare.outputs.run }}
      DATE: ${{ needs.prepare.outputs.date }}
      # Matrix-Werte als Umgebungsvariablen, damit die Shell-Skripte lesbar bleiben
      DOWNLOADS: ${{ matrix.downloads }}
      VARIABLES: ${{ matrix.variables }}
    strategy:
      fail-fast: false      # eine fehlgeschlagene Gruppe stoppt die anderen nicht
      matrix:
        include:
          # downloads:  DWD_PARAMETER:zielordner:dateiprefix:startstunde
          # variables:  variable:eingabeordner
          - name: temp_ww
            downloads: "T_2M:t2m:t2m:0 WW:ww:ww:1"
            variables: "t2m:t2m ww:ww"

          - name: precip
            downloads: "TOT_PREC:tp:tot_prec:0"
            variables: "tp:tp tp_acc:tp"

          - name: wind
            downloads: "VMAX_10M:wind:wind:0"
            variables: "wind:wind"

          - name: convective
            downloads: "CAPE_ML:cape_ml:cape_ml:0 DBZ_CMAX:dbz_cmax:dbz_cmax:0"
            variables: "cape_ml:cape_ml dbz_cmax:dbz_cmax"

          - name: snow_cloud_water
            downloads: "H_SNOW:snow:snow:0 SNOWLMT:snowfall:snowfall:0 CLCT:cloud:cloud:0 TWATER:twater:twater:0"
            variables: "snow:snow change_snow:snow snowfall:snowfall cloud:cloud twater:twater"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip            # ersetzt den manuellen actions/cache-Schritt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Gitterkoordinaten (beide Dateien gleichzeitig laden)
      - name: Download grid (clat/clon)
        run: |
          mkdir -p data/grid
          base=https://github.com/elotex0/meteo-bin/releases/download/icon-d2
          wget -q "$base/clat.grib2" -O data/grid/clat.grib2 &
          wget -q "$base/clon.grib2" -O data/grid/clon.grib2 &
          wait

      # Alle Parameter x Stunden dieser Gruppe laufen in einem gemeinsamen Pool
      - name: Download GRIB2 files (nur benötigte Parameter)
        run: |
          export DATE RUN
          for spec in $DOWNLOADS; do
            IFS=: read -r PARAM DIR PREFIX START <<< "$spec"
            mkdir -p "data/$DIR"
            for h in $(seq "$START" "$MAX_HOUR"); do
              echo "$PARAM $DIR $PREFIX $h"
            done
          done | xargs -P "$DL_PARALLEL" -L1 bash -c '
            PARAM=$0; DIR=$1; PREFIX=$2
            i=$(printf "%03d" "$3")
            URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/${PARAM}/r/${DATE}T${RUN}:00/s/PT${i}H00M.grib2"
            OUT="data/${DIR}/${PREFIX}_${i}.grib2"
            wget -q --tries=3 --timeout=30 -O "$OUT" "$URL" \
              || { echo "Datei $URL nicht verfügbar, überspringe..."; rm -f "$OUT"; }
          '

      # Abbruch, wenn für einen Parameter gar nichts geladen wurde (z. B. Lauf noch nicht veröffentlicht)
      - name: Check downloads
        run: |
          for spec in $DOWNLOADS; do
            IFS=: read -r PARAM DIR PREFIX START <<< "$spec"
            n=$(find "data/$DIR" -name '*.grib2' | wc -l)
            echo "$PARAM: $n Dateien"
            if [ "$n" -eq 0 ]; then
              echo "::error::Keine Dateien für $PARAM (Run $RUN, $DATE) gefunden"
              exit 1
            fi
          done

      # Variablen mit unterschiedlichem Eingabeordner laufen parallel.
      # Variablen mit gleichem Eingabeordner (z. B. snow/change_snow) laufen nacheinander,
      # und jede Eingabegruppe bekommt eine eigene Grid-Kopie, damit sich keine Prozesse
      # beim Schreiben/Lesen von cfgrib-Indexdateien in die Quere kommen.
      - name: Generate PNGs
        run: |
          export VARIABLES
          printf '%s\n' $VARIABLES | cut -d: -f2 | sort -u \
            | xargs -P "$(nproc)" -I{} bash -c '
              IN={}
              cp -r data/grid "data/grid_$IN"
              for spec in $VARIABLES; do
                IFS=: read -r VAR INDIR <<< "$spec"
                [ "$INDIR" = "$IN" ] || continue
                mkdir -p "icond2/$VAR"
                python models/icon-d2/bin_icon-d2.py "data/$INDIR" "icond2/$VAR" "$VAR" "data/grid_$IN"
              done
            '

      - name: Upload Bin artifact
        uses: actions/upload-artifact@v7
        with:
          name: icond2-${{ matrix.name }}
          path: icond2/
          retention-days: ${{ env.ARTIFACT_DAYS }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) Ergebnisse zusammenführen, Metadaten erzeugen, komprimieren, nach R2 hochladen
  # ---------------------------------------------------------------------------
  deploy_to_r2:
    runs-on: ubuntu-latest
    needs: [prepare, generate_pngs]
    timeout-minutes: 30
    env:
      RUN: ${{ needs.prepare.outputs.run }}
      DATE: ${{ needs.prepare.outputs.date }}
      BUCKET: ${{ secrets.ICOND2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.ICON_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ICON_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto    # von R2 erwartet, vermeidet Region-Warnungen
      R2_ENDPOINT: https://${{ secrets.ICON_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Alle Gruppen-Artifacts landen direkt in einem Ordner (Struktur: icond2/<RUN>/<variable>/...)
      - name: Download all Bin artifacts (merged)
        uses: actions/download-artifact@v8
        with:
          pattern: icond2-*
          merge-multiple: true
          path: icond2/${{ needs.prepare.outputs.run }}

      - name: Generate Metadata
        run: python models/icon-d2/meta_icon-d2.py "icond2/$RUN" "$RUN" "$DATE"

      # Parallel gzip-komprimieren (Dateiname bleibt gleich, Inhalt ist gzip)
      - name: Dateien mit gzip komprimieren
        run: |
          find "icond2/$RUN" -type f -print0 \
            | xargs -0 -P "$(nproc)" -I{} sh -c 'gzip -9 -n -c "{}" > "{}.tmp" && mv "{}.tmp" "{}"'

      # Alle alten Run-Ordner löschen, den aktuellen behalten
      - name: Clean old runs on R2 except current
        run: |
          for run_folder in $(aws s3 ls "s3://$BUCKET/icon-d2/" --endpoint-url "$R2_ENDPOINT" | awk '/PRE/ {print $2}' | sed 's#/##'); do
            if [ "$run_folder" != "$RUN" ]; then
              aws s3 rm "s3://$BUCKET/icon-d2/$run_folder/" --recursive --endpoint-url "$R2_ENDPOINT"
            fi
          done

      # Erst die Daten, zuletzt die metadata.json, damit Clients nie auf noch fehlende Dateien verweisen
      - name: Upload current run and metadata.json to R2
        run: |
          aws s3 sync "./icond2/$RUN/" "s3://$BUCKET/icon-d2/$RUN/" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/gzip

          aws s3 cp ./icond2/metadata.json "s3://$BUCKET/icon-d2/metadata.json" \
            --endpoint-url "$R2_ENDPOINT"