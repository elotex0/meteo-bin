name: ICON-D2 Pipeline

on:
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}/tools

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.set_run_date.outputs.run }}
      date: ${{ steps.set_run_date.outputs.date }}
    steps:
      - name: Set RUN and DATE
        id: set_run_date
        run: |
          HOUR=$(date -u +%H)
          case $HOUR in
            00|01|02|03) RUN=00 ;;
            04|05|06) RUN=03 ;;
            07|08|09) RUN=06 ;;
            10|11|12) RUN=09 ;;
            13|14|15) RUN=12 ;;
            16|17|18) RUN=15 ;;
            19|20|21) RUN=18 ;;
            22|23) RUN=21 ;;
          esac
          echo "run=$RUN" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

  generate_pngs:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      RUN: ${{ needs.prepare.outputs.run }}
      DATE: ${{ needs.prepare.outputs.date }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # downloads: DWD_PARAM:zielordner:dateiprefix:startstunde
          # variables: variable:eingabeordner
          - name: t2m
            downloads: "T_2M:t2m:t2m:0"
            variables: "t2m:t2m"
          - name: ww
            downloads: "WW:ww:ww:1"
            variables: "ww:ww"
          - name: precip
            downloads: "TOT_PREC:tp:tot_prec:0"
            variables: "tp:tp tp_acc:tp"
          - name: wind
            downloads: "VMAX_10M:wind:wind:0"
            variables: "wind:wind"
          - name: convective
            downloads: "CAPE_ML:cape_ml:cape_ml:0 DBZ_CMAX:dbz_cmax:dbz_cmax:0"
            variables: "cape_ml:cape_ml dbz_cmax:dbz_cmax"
          - name: snow_cloud_water
            downloads: "H_SNOW:snow:snow:0 SNOWLMT:snowfall:snowfall:0 CLCT:cloud:cloud:0 TWATER:twater:twater:0"
            variables: "snow:snow change_snow:snow snowfall:snowfall cloud:cloud twater:twater"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download grid (clat/clon)
        run: |
          mkdir -p data/grid
          wget -q https://github.com/elotex0/meteo-bin/releases/download/icon-d2/clat.grib2 -O data/grid/clat.grib2 &
          wget -q https://github.com/elotex0/meteo-bin/releases/download/icon-d2/clon.grib2 -O data/grid/clon.grib2 &
          wait

      - name: Download GRIB2 files (nur benötigte Parameter)
        run: |
          export DATE RUN
          for spec in ${{ matrix.downloads }}; do
            IFS=: read -r PARAM DIR PREFIX START <<< "$spec"
            export PARAM DIR PREFIX
            mkdir -p "data/$DIR"
            seq "$START" 48 | xargs -P 16 -I{} bash -c '
              i=$(printf "%03d" {})
              URL="https://opendata.dwd.de/weather/nwp/v1/m/icon-d2/p/${PARAM}/r/${DATE}T${RUN}:00/s/PT${i}H00M.grib2"
              OUT="data/${DIR}/${PREFIX}_${i}.grib2"
              wget -q -O "$OUT" "$URL" || { echo "Datei $URL nicht verfügbar, überspringe..."; rm -f "$OUT"; }
            '
          done

      - name: Generate PNGs
        run: |
          for spec in ${{ matrix.variables }}; do
            IFS=: read -r VAR INDIR <<< "$spec"
            mkdir -p "icond2/$VAR"
            python models/icon-d2/bin_icon-d2.py "data/$INDIR" "icond2/$VAR" "$VAR" data/grid
          done

      - name: Upload Bin artifact
        uses: actions/upload-artifact@v7
        with:
          name: icond2-${{ matrix.name }}
          path: icond2/

  deploy_to_r2:
    runs-on: ubuntu-latest
    needs: [prepare, generate_pngs]
    env:
      RUN: ${{ needs.prepare.outputs.run }}
      DATE: ${{ needs.prepare.outputs.date }}
      AWS_ACCESS_KEY_ID: ${{ secrets.ICON_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ICON_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://${{ secrets.ICON_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all Bin artifacts (merged)
        uses: actions/download-artifact@v8
        with:
          pattern: icond2-*
          merge-multiple: true
          path: icond2/${{ needs.prepare.outputs.run }}

      - name: Generate Metadata
        run: python models/icon-d2/meta_icon-d2.py icond2/$RUN $RUN $DATE

      - name: Dateien mit gzip komprimieren
        run: |
          find icond2/$RUN -type f -print0 | xargs -0 -P 4 -I{} sh -c 'gzip -9 -n -c "{}" > "{}.tmp" && mv "{}.tmp" "{}"'

      - name: Clean old runs on R2 except current
        run: |
          for run_folder in $(aws s3 ls s3://${{ secrets.ICOND2_BUCKET }}/icon-d2/ --endpoint-url $R2_ENDPOINT | awk '/PRE/ {print $2}' | sed 's#/##'); do
            if [ "$run_folder" != "$RUN" ]; then
              aws s3 rm s3://${{ secrets.ICOND2_BUCKET }}/icon-d2/$run_folder/ --recursive --endpoint-url $R2_ENDPOINT
            fi
          done

      - name: Upload current run and metadata.json to R2
        run: |
          aws s3 sync ./icond2/$RUN/ s3://${{ secrets.ICOND2_BUCKET }}/icon-d2/$RUN/ \
            --endpoint-url $R2_ENDPOINT \
            --content-type application/gzip

          aws s3 cp ./icond2/metadata.json s3://${{ secrets.ICOND2_BUCKET }}/icon-d2/metadata.json \
            --endpoint-url $R2_ENDPOINT